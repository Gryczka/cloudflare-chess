name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck (.astro + .ts) and run unit + Durable Object integration tests.
      - run: npm run check
      # Ensure the app still builds for the Cloudflare adapter.
      - run: npm run build
